name: Dispatch
on:
  push:
    branches: [main]

# The dispatch uses a GitHub App token, so the workflow's own GITHUB_TOKEN needs no access
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Setup node 🏗
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Put node version 📺
        shell: bash
        run: echo "The version of Node.js used is $(node -v)"

      - name: Get GitHub API token 🔐
        id: get-github-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: kamegoro
          repositories: manage-submodules-in-actions-dispatch

      - name: 🚀 Execution of dispatch event
        env:
          GH_APP_TOKEN: ${{ steps.get-github-token.outputs.token }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_APP_TOKEN" \
            https://api.github.com/repos/kamegoro/manage-submodules-in-actions-dispatch/dispatches \
            -d '{"event_type":"openapi-update"}'
